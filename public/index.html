<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF マークアップ共有 - セッション作成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a2236;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .drop-zone {
      border: 2.5px dashed #94a3b8;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f8fafc;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 40px; margin-bottom: 10px; }
    .drop-text { font-size: 15px; color: #64748b; }
    .drop-hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .file-selected {
      margin-top: 12px;
      font-size: 14px;
      color: #1d4ed8;
      font-weight: 600;
      word-break: break-all;
    }

    .btn-primary {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 48px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

    .progress-bar {
      display: none;
      height: 6px;
      background: #dbeafe;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 4px;
      transition: width 0.3s;
      width: 0%;
    }

    /* 結果カード */
    .result-card {
      display: none;
      margin-top: 28px;
      padding: 24px;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 12px;
    }
    .result-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: #166534;
      margin-bottom: 12px;
    }
    .url-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #d1fae5;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
    .url-text {
      flex: 1;
      font-size: 13px;
      color: #1e40af;
      word-break: break-all;
      font-family: monospace;
    }
    .btn-copy {
      padding: 6px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
    }
    .btn-copy:hover { background: #1d4ed8; }
    .btn-copy.copied { background: #16a34a; }

    .qr-container {
      text-align: center;
      margin-bottom: 16px;
    }
    .qr-container p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 8px;
      border: 4px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .btn-open {
      display: block;
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 48px;
      line-height: 1.4;
    }
    .btn-open:hover { background: #15803d; }

    .error-msg {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 13px;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PDF マークアップ共有</h1>
    <p class="subtitle">図面PDFを登録してセッションを作成し、QRコードで作業員と共有します</p>

    <label for="pdf-input">図面PDFを選択</label>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="pdf-input" accept="application/pdf">
      <div class="drop-icon">📄</div>
      <div class="drop-text">タップまたはドラッグ&ドロップ</div>
      <div class="drop-hint">PDFファイル（最大50MB）</div>
      <div class="file-selected" id="file-selected"></div>
    </div>

    <div style="margin-top:20px;">
      <label for="pin-input">参加PIN（4桁以上の数字）</label>
      <input type="tel" id="pin-input" placeholder="例：1234" maxlength="8"
        style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:18px;letter-spacing:0.2em;text-align:center;margin-top:8px;min-height:48px;outline:none;"
        inputmode="numeric" pattern="[0-9]*">
      <p style="font-size:12px;color:#9ca3af;margin-top:4px;">QRコードと一緒に作業員へ伝えてください</p>
    </div>

    <button class="btn-primary" id="create-btn" disabled>セッションを作成</button>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="error-msg" id="error-msg"></div>

    <div class="result-card" id="result-card">
      <h2>✅ セッション作成完了</h2>
      <div id="pin-display" style="background:#fef9c3;border:1.5px solid #fde047;border-radius:8px;padding:10px 16px;margin-bottom:14px;text-align:center;">
        <span style="font-size:13px;color:#713f12;font-weight:600;">参加PIN：</span>
        <span id="session-pin" style="font-size:28px;font-weight:900;letter-spacing:0.25em;color:#92400e;font-family:monospace;"></span>
      </div>
      <div class="url-box">
        <span class="url-text" id="session-url"></span>
        <button class="btn-copy" id="copy-btn">コピー</button>
      </div>
      <div class="qr-container">
        <p>作業員はこのQRコードをスキャンしてください</p>
        <div id="qrcode"></div>
      </div>
      <a class="btn-open" id="open-btn" href="#" target="_blank">このデバイスで開く</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const dropZone = document.getElementById('drop-zone');
    const pdfInput = document.getElementById('pdf-input');
    const fileSelected = document.getElementById('file-selected');
    const createBtn = document.getElementById('create-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const errorMsg = document.getElementById('error-msg');
    const resultCard = document.getElementById('result-card');
    const sessionUrl = document.getElementById('session-url');
    const copyBtn = document.getElementById('copy-btn');
    const openBtn = document.getElementById('open-btn');
    const qrcodeDiv = document.getElementById('qrcode');

    const pinInput = document.getElementById('pin-input');
    let selectedFile = null;

    function checkReady() {
      createBtn.disabled = !(selectedFile && pinInput.value.length >= 4);
    }

    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '');
      checkReady();
    });

    pdfInput.addEventListener('change', () => {
      if (pdfInput.files[0]) selectFile(pdfInput.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') selectFile(file);
      else showError('PDFファイルを選択してください');
    });

    function selectFile(file) {
      selectedFile = file;
      fileSelected.textContent = `📎 ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      checkReady();
      hideError();
      resultCard.style.display = 'none';
    }

    createBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      createBtn.disabled = true;
      hideError();
      progressBar.style.display = 'block';
      progressFill.style.width = '10%';

      const pin = pinInput.value.trim();
      if (pin.length < 4) {
        showError('PINは4桁以上の数字で入力してください');
        createBtn.disabled = false;
        progressBar.style.display = 'none';
        return;
      }
      const formData = new FormData();
      formData.append('pdf', selectedFile);
      formData.append('pin', pin);

      try {
        progressFill.style.width = '40%';
        const res = await fetch('/api/sessions', { method: 'POST', body: formData });
        progressFill.style.width = '80%';
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'エラーが発生しました');
        }
        const { sessionId } = await res.json();
        progressFill.style.width = '100%';
        setTimeout(() => { progressBar.style.display = 'none'; }, 400);

        const url = `${location.origin}/session/${sessionId}`;
        sessionUrl.textContent = url;
        openBtn.href = url;
        document.getElementById('session-pin').textContent = pin;

        // QRコード生成
        qrcodeDiv.innerHTML = '';
        new QRCode(qrcodeDiv, { text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });

        resultCard.style.display = 'block';
        resultCard.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        progressBar.style.display = 'none';
        showError(err.message);
        createBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(sessionUrl.textContent).then(() => {
        copyBtn.textContent = 'コピー済み';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'コピー'; copyBtn.classList.remove('copied'); }, 2000);
      });
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
    function hideError() {
      errorMsg.style.display = 'none';
    }
  </script>
</body>
</html>
